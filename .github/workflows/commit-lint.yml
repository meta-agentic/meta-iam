name: commit-lint

# Server-side enforcement (the real gate). Every commit in a PR must:
#   - use a Conventional Commits subject prefix
#   - have a human author (no anthropic.com / "Claude" authorship)
#   - carry no AI attribution trailers (Co-Authored-By: Claude…, Claude-Session:, claude.ai/code)
#   - carry no internal issue-tracker key in the subject or body. With rebase-merge the message
#     lands verbatim on public main, and a force-push does not purge it. Same clause as
#     pr-hygiene and the local pre-push hook: all three source scripts/hygiene-patterns.sh.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Validate PR commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # The patterns are defined once, for every consumer (scripts/hygiene-patterns.sh).
          . "$GITHUB_WORKSPACE/scripts/hygiene-patterns.sh" || { echo "::error::cannot read scripts/hygiene-patterns.sh"; exit 2; }
          re='^(feat|fix|chore|docs|ci|build|refactor|test|perf|style|revert)(\([a-z0-9._/-]+\))?!?: .+'
          fail=0
          for sha in $(git rev-list "$BASE..$HEAD"); do
            subject=$(git log -1 --format=%s "$sha")
            body=$(git log -1 --format=%B "$sha")
            ae=$(git log -1 --format=%ae "$sha")
            an=$(git log -1 --format=%an "$sha")
            # Before the tooling-subject skip: a revert or merge message can quote a key too.
            if has_internal_leak "$body"; then
              echo "::error::[$sha] commit message carries an internal tracker key or a foreign project's ADR-<code>- prefix (not echoed: CI logs are public)"; fail=1
            fi
            case "$subject" in
              Merge\ *|Revert\ *|fixup!*|squash!*) continue ;;
            esac
            if ! grep -qE "$re" <<<"$subject"; then
              echo "::error::[$sha] non-conventional subject: $subject"; fail=1
            fi
            if grep -qiE 'anthropic\.com|^claude$|<claude@' <<<"$ae$an"; then
              echo "::error::[$sha] AI-attributed author: $an <$ae>"; fail=1
            fi
            if grep -qiE "$hygiene_ai_commit" <<<"$body"; then
              echo "::error::[$sha] AI attribution trailer present in commit body"; fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "Commit-lint failed. Fix with an interactive rebase (reword/amend author) before merging."
            exit 1
          fi
          echo "All PR commits pass: conventional prefix, human author, no AI trailers, no internal keys."
